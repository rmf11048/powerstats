<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Meter Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
body{
    margin:0;
    background:#0d0d0d;
    color:#eee;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

.container{
    padding:16px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1a1a1a;
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.title{
    font-size:18px;
    margin-bottom:10px;
    color:#aaa;
}

.period-subtitle{
    color:#888;
    font-size:14px;
    margin-bottom:10px;
}

.power{
    font-size:36px;
    font-weight:600;
}

.import{ color:#4da3ff; }
.export{ color:#ff4d4d; }

.timestamp{
    color:#888;
    font-size:14px;
    margin-top:4px;
}

.stats{
    font-size:16px;
    margin-bottom:10px;
    color:#aaa;
}

.stats span{
    margin-right:18px;
}

.stats .import{
    color:#4da3ff;
}

.stats .export{
    color:#ff4d4d;
}

.history-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

.history-table th,
.history-table td{
    padding:10px 8px;
    border-bottom:1px solid #2a2a2a;
    text-align:left;
}

.history-table th{
    color:#aaa;
    font-weight:600;
}

.history-table td:last-child,
.history-table th:last-child{
    text-align:right;
}

.history-table td:nth-child(2),
.history-table th:nth-child(2),
.history-table td:nth-child(3),
.history-table th:nth-child(3){
    text-align:right;
}

.history-empty{
    color:#888;
    font-size:14px;
}

.invoice-totals{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-size:16px;
}

.invoice-cost{
    margin-top:12px;
    font-size:18px;
    color:#f6d365;
    font-weight:600;
}

.invoice-comparison{
    margin-top:10px;
    font-size:13px;
    color:#c8c8c8;
    line-height:1.45;
}

.invoice-comparison-strong{
    font-weight:600;
}

.trend-up{
    color:#ff8080;
}

.trend-down{
    color:#7ddc8b;
}

.trend-flat{
    color:#d8d8d8;
}

.invoice-card{
    cursor:pointer;
}

.invoice-card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.invoice-toggle{
    color:#888;
    font-size:14px;
    white-space:nowrap;
}

.invoice-hidden{
    display:none;
}

.solar-form{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    align-items:end;
    margin-bottom:16px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    color:#888;
    font-size:14px;
}

.field input{
    border:1px solid #2e2e2e;
    border-radius:10px;
    padding:10px 12px;
    background:#111;
    color:#eee;
    font-size:16px;
}

.button{
    border:0;
    border-radius:10px;
    padding:11px 14px;
    background:#4da3ff;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.button:disabled{
    opacity:0.6;
    cursor:default;
}

.button-danger{
    background:transparent;
    color:#999;
    border:1px solid #3a3a3a;
    padding:8px 12px;
    font-weight:500;
}

.solar-summary{
    color:#aaa;
    font-size:15px;
    margin-bottom:12px;
}

.solar-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

.solar-table th,
.solar-table td{
    padding:10px 8px;
    border-bottom:1px solid #2a2a2a;
    text-align:left;
}

.solar-table th{
    color:#aaa;
    font-weight:600;
}

.solar-table td:nth-child(2),
.solar-table th:nth-child(2),
.solar-table td:nth-child(3),
.solar-table th:nth-child(3),
.solar-table td:nth-child(4),
.solar-table th:nth-child(4){
    text-align:right;
}

.solar-status{
    color:#888;
    font-size:14px;
    margin-bottom:10px;
}

canvas{
    width:100%;
    height:225px !important;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">
        <div id="power" class="power">Loading...</div>
        <div id="time" class="timestamp"></div>
    </div>

    <div id="currentInvoiceCard" class="card invoice-card">
        <div class="invoice-card-header">
            <div class="title">Current Invoice</div>
            <div id="invoiceToggleLabel" class="invoice-toggle">Tap to show previous</div>
        </div>
        <div id="currentInvoiceRange" class="period-subtitle">Loading...</div>
        <div id="currentInvoiceTotals" class="invoice-totals history-empty">Loading...</div>
        <div id="currentInvoiceCost" class="invoice-cost">Loading...</div>
        <div id="currentInvoiceComparison" class="invoice-comparison history-empty">Loading...</div>
    </div>

    <div id="previousInvoiceCard" class="card invoice-hidden">
        <div class="title">Previous Invoice</div>
        <div id="previousInvoiceRange" class="period-subtitle">Loading...</div>
        <div id="previousInvoiceTotals" class="invoice-totals history-empty">Loading...</div>
        <div id="previousInvoiceCost" class="invoice-cost">Loading...</div>
    </div>

    <div class="card">
        <div class="title">Last 4 Hours</div>
        <div class="stats" id="statsToday6h"></div>
        <canvas id="chart6h"></canvas>
    </div>

    <div class="card">
        <div class="title">Today</div>
        <div class="stats" id="statsToday"></div>
        <canvas id="chartToday"></canvas>
    </div>

    <div class="card">
        <div class="title">Yesterday</div>
        <div class="stats" id="statsYesterday"></div>
        <canvas id="chartYesterday"></canvas>
    </div>

    <div class="card">
        <div class="title">Solar Production</div>
        <form id="solarForm" class="solar-form">
            <div class="field">
                <label for="solarDate">Date</label>
                <input id="solarDate" name="solarDate" type="date" required>
            </div>
            <div class="field">
                <label for="solarValue">Production (kWh)</label>
                <input id="solarValue" name="solarValue" type="number" step="0.01" min="0" required>
            </div>
            <button id="solarSubmit" type="submit" class="button">Queue solar value</button>
        </form>
        <div id="solarStatus" class="solar-status"></div>
        <div id="solarSummary" class="solar-summary">Loading...</div>
        <div id="solarEntries" class="history-empty">Loading...</div>
    </div>

    <div class="card">
        <div class="title">Last 31 Days</div>
        <div id="historyTotals" class="history-empty">Loading...</div>
    </div>

</div>

<script>

const API_BASE_URL = "http://192.168.1.4:8080";
const API_SOLAR_PRODUCTION = `${API_BASE_URL}/solarproduction`;
const INVOICE_START_DAY = 24;
const INVOICE_END_DAY = 23;
const ENERGY_PRICE_PER_KWH = 0.142;
const REDUCED_VAT_KWH_LIMIT = 200;
const REDUCED_VAT_RATE = 0.06;
const STANDARD_VAT_RATE = 0.23;
const DAILY_FIXED_TERM = 0.5780;

let chart6h;

const ssrData = parseSsrData();
const DISPLAY_TIME_ZONE = 'UTC';

function parseSsrData(){
    const dataEl = document.getElementById('dashboard-data');

    if(!dataEl){
        return {};
    }

    try{
        const rawData = dataEl.textContent.trim();
        if(!rawData){
            return {};
        }
        return JSON.parse(rawData);
    }catch(e){
        console.error('Unable to parse SSR data', e);
        return {};
    }
}

function getDashboardToday(){
    if(typeof ssrData.currentDate === 'string'){
        return new Date(ssrData.currentDate);
    }

    if(typeof ssrData.currentDateLong === 'number'){
        return new Date(ssrData.currentDateLong);
    }

    return new Date();
}

function getStatsForDate(dateString){
    return ssrData.statsByDate?.[dateString]
        ?? ssrData.stats?.[dateString]
        ?? null;
}

function unixToTime(t){
    const d = new Date(t*1000);
    return d.toLocaleTimeString(['pt-PT'], {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: DISPLAY_TIME_ZONE
    });
}

function unixToDate(t){
    const d = new Date(t*1000);
    return d.toLocaleString(['pt-PT'], {
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false,
        timeZone: DISPLAY_TIME_ZONE
    });
}

function createChart(ctx, tickIntervalSeconds){
    return new Chart(ctx,{
        type:'line',
        data:{
            labels:[],
            datasets:[
            {
                label:'Import',
                data:[],
                borderColor:'#4da3ff',
				borderWidth:1,
                tension:0.2,
                pointRadius:0
            },
            {
                label:'Export',
                data:[],
                borderColor:'#ff4d4d',
				borderWidth:1,

                pointRadius:0
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            animation:false,
            scales:{
                x:{
                    afterBuildTicks:function(axis){
                        const timestamps = axis.chart.$timestamps || [];

                        axis.ticks = axis.ticks.filter(tick => {
                            const timestamp = timestamps[tick.value];
                            return timestamp && timestamp % tickIntervalSeconds === 0;
                        });
                    },
                    grid:{
                        color:"rgba(255,255,255,0.08)",
                        drawTicks:true,
                        tickLength:8,
                        tickColor:"#666",

                    ticks:{
                        color:"#888",

                        maxRotation:45,

                    }
                },
                y:{
                    ticks:{color:"#888"}
                }
            },
			plugins:{
				legend:{
					display:false
				}
			}
        }
    });
}

async function fetchCurrent(){
    const d = ssrData.current ?? ssrData.last;

    if(!d){
        return;
    }

    const powerEl = document.getElementById("power");
    const timeEl = document.getElementById("time");
    const time = unixToDate(d.t);

    if(d.i > 0){
        powerEl.innerHTML = `<span class="import">${d.i} W Import</span>`;
    }else{
        powerEl.innerHTML = `<span class="export">${d.e} W Export</span>`;
    }

    timeEl.innerText = time;
}

function getDateString(date){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function getDateInputValue(date = new Date()){
    return getDateString(date);
}

function parseDateInputValue(value){
    const [year, month, day] = value.split('-').map(Number);
    return new Date(year, month - 1, day).getTime();
}

function getYesterday(date = new Date()){
    const yesterday = new Date(date);
    yesterday.setDate(yesterday.getDate() - 1);
    return yesterday;
}

function getPreviousDates(count, startDate = new Date()){
    const dates = [];
    const current = new Date(startDate);

    for(let i = 0; i < count; i++){
        current.setDate(current.getDate() - 1);
        dates.push(new Date(current));
    }

    return dates;
}

function getPreviousAndCurrentDates(previousCount, currentDate = new Date()){
    const dates = getPreviousDates(previousCount, currentDate);
    dates.unshift(new Date(currentDate));
    return dates;
}

function addDays(date, days){
    const result = new Date(date);
    result.setDate(result.getDate() + days);
    return result;
}

function addMonths(date, months){
    return new Date(date.getFullYear(), date.getMonth() + months, date.getDate());
}

function getDateRange(startDate, endDate){
    const dates = [];
    const current = new Date(startDate);

    while(current <= endDate){
        dates.push(new Date(current));
        current.setDate(current.getDate() + 1);
    }

    return dates;
}

function formatDateLabel(date){
    return date.toLocaleDateString(['pt-PT'], {
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
    });
}

function formatCurrency(value){
    return value.toLocaleString(['pt-PT'], {
        style:'currency',
        currency:'EUR'
    });
}

function calculateSolarSavings(kwh){
    const energyComponent = ENERGY_PRICE_PER_KWH * (1 + STANDARD_VAT_RATE);
    const extraTaxComponent = EXTRA_TAX_PER_KWH * (1 + STANDARD_VAT_RATE);
    return kwh * (energyComponent + extraTaxComponent);
}

async function fetchDailyExportTotal(date){
    const data = getStatsForDate(getDateString(date));
    return data ? Math.max((data.maxTee ?? 0) - (data.minTee ?? 0), 0) : 0;
}

async function fetchExportBetweenDates(startDate, endDate){
    const dates = getDateRange(addDays(startDate, 1), endDate);

    if(!dates.length){
        return 0;
    }

    const totals = await Promise.all(dates.map(date => fetchDailyExportTotal(date)));
    return totals.reduce((sum, value) => sum + value, 0);
}

function normalizeSolarEntries(data){
    const entries = Array.isArray(data)
        ? data
        : Array.isArray(data?.items)
            ? data.items
            : Array.isArray(data?.values)
                ? data.values
                : [];

    return entries
        .filter(entry =>
            entry &&
            entry.d !== undefined &&
            (entry.k !== undefined || entry.K !== undefined)
        )
        .map(entry => ({
            d: Number(entry.d),
            K: Number(entry.k ?? entry.K)
        }))
        .filter(entry => !Number.isNaN(entry.d) && !Number.isNaN(entry.K))
        .sort((a, b) => b.d - a.d);
}

async function enrichSolarEntries(entries){
    const ascendingEntries = [...entries].sort((a, b) => a.d - b.d);
    const enrichedEntries = [];

    for(let i = 0; i < ascendingEntries.length; i++){
        const currentEntry = ascendingEntries[i];

        if(i === 0){
            enrichedEntries.push({
                ...currentEntry,
                producedDelta: null,
                exportedDelta: null,
                savedKwh: null,
                savedEuros: null
            });
            continue;
        }

        const previousEntry = ascendingEntries[i - 1];
        const producedDelta = Math.max(currentEntry.K - previousEntry.K, 0);
        const exportedDelta = await fetchExportBetweenDates(
            new Date(previousEntry.d),
            new Date(currentEntry.d)
        );
        const savedKwh = Math.max(producedDelta - exportedDelta, 0);

        enrichedEntries.push({
            ...currentEntry,
            producedDelta,
            exportedDelta,
            savedKwh,
            savedEuros: calculateSolarSavings(savedKwh)
        });
    }

    return enrichedEntries.sort((a, b) => b.d - a.d);
}

function getCurrentInvoicePeriod(today = new Date()){
    let start;
    let end;

    if(today.getDate() >= INVOICE_START_DAY){
        start = new Date(today.getFullYear(), today.getMonth(), INVOICE_START_DAY);
        end = new Date(today.getFullYear(), today.getMonth() + 1, INVOICE_END_DAY);
    }else{
        start = new Date(today.getFullYear(), today.getMonth() - 1, INVOICE_START_DAY);
        end = new Date(today.getFullYear(), today.getMonth(), INVOICE_END_DAY);
    }

    return { start, end };
}

function calculateEstimatedCost(importTotal, periodDays){
    const reducedVatKwh = Math.min(importTotal, REDUCED_VAT_KWH_LIMIT);
    const standardVatKwh = Math.max(importTotal - REDUCED_VAT_KWH_LIMIT, 0);

    const reducedEnergyCost = reducedVatKwh * ENERGY_PRICE_PER_KWH * (1 + REDUCED_VAT_RATE);
    const standardEnergyCost = standardVatKwh * ENERGY_PRICE_PER_KWH * (1 + STANDARD_VAT_RATE);
    const fixedTermCost = periodDays * DAILY_FIXED_TERM * (1 + STANDARD_VAT_RATE);
    const extraPerKwhTax = importTotal * EXTRA_TAX_PER_KWH * (1 + STANDARD_VAT_RATE);

    return reducedEnergyCost
        + standardEnergyCost
        + fixedTermCost
        + extraPerKwhTax
        + AUDIOVISUAL_CONTRIBUTION
        + OTHER_FIXED_TAX;
}

function calculateEstimatedDailyCost(importTotal){
    const reducedVatKwh = Math.min(importTotal, REDUCED_VAT_KWH_LIMIT);
    const standardVatKwh = Math.max(importTotal - REDUCED_VAT_KWH_LIMIT, 0);

    const reducedEnergyCost = reducedVatKwh * ENERGY_PRICE_PER_KWH * (1 + REDUCED_VAT_RATE);
    const standardEnergyCost = standardVatKwh * ENERGY_PRICE_PER_KWH * (1 + STANDARD_VAT_RATE);
    const fixedTermCost = DAILY_FIXED_TERM * (1 + STANDARD_VAT_RATE);
    const extraPerKwhTax = importTotal * EXTRA_TAX_PER_KWH * (1 + STANDARD_VAT_RATE);

    return reducedEnergyCost + standardEnergyCost + fixedTermCost + extraPerKwhTax;
}

function describeDifference(value, unit, moreLabel, lessLabel, precision = 2){
    if(Math.abs(value) < 0.005){
        return `about the same ${unit}`;
    }

    const amount = Math.abs(value).toFixed(precision);
    return value > 0
        ? `${amount} ${unit} ${moreLabel}`
        : `${amount} ${unit} ${lessLabel}`;
}

function getTrendClass(value){
    if(Math.abs(value) < 0.005){
        return 'trend-flat';
    }

    return value > 0 ? 'trend-up' : 'trend-down';
}

function aggregateByMinuteMax(data){
    const buckets = new Map();

    for(const point of data){
        const minuteTimestamp = Math.floor(point.t / 60) * 60;
        const existing = buckets.get(minuteTimestamp);

        if(existing){
            existing.i = Math.max(existing.i, point.i);
            existing.e = Math.max(existing.e, point.e);
        }else{
            buckets.set(minuteTimestamp, {
                t: minuteTimestamp,
                i: point.i,
                e: point.e
            });
        }
    }

    return Array.from(buckets.values()).sort((a, b) => a.t - b.t);
}

function renderInvoiceTotals(rangeId, totalsId, costId, period, totals, isPartial, periodDays){
    document.getElementById(rangeId).innerText =
        `${formatDateLabel(period.start)} to ${formatDateLabel(period.end)}`;

    const estimatedCost = calculateEstimatedCost(totals.importTotal, periodDays);

    document.getElementById(totalsId).innerHTML = `
        <span class="import">Import: ${totals.importTotal.toFixed(2)} kWh</span>
    `;

    document.getElementById(costId).innerText =
        `Estimated cost: ${formatCurrency(estimatedCost)}`;
}

function renderInvoiceComparison(elementId, comparison){
    const comparisonEl = document.getElementById(elementId);

    if(!comparisonEl){
        return;
    }

    if(!comparison){
        comparisonEl.innerHTML = `<span class="history-empty">Comparison unavailable.</span>`;
        return;
    }

    const direction = comparison.importDelta > 0 ? 'more' : 'less';
    const importDelta = Math.abs(comparison.importDelta).toFixed(2);
    const costDelta = Math.abs(comparison.costDelta).toFixed(2);
    const trendClass = getTrendClass(comparison.costDelta);

    if(Math.abs(comparison.importDelta) < 0.005 && Math.abs(comparison.costDelta) < 0.005){
        comparisonEl.innerHTML = `<span class="invoice-comparison-strong trend-flat">about the same as previous invoice</span>`;
        return;
    }

    comparisonEl.innerHTML = `
        <span class="invoice-comparison-strong ${trendClass}">${direction} ${importDelta} kWh (${costDelta} EUR)</span>
        <span> than previous invoice</span>
    `;
}

function renderInvoiceError(rangeId, totalsId, costId, period){
    document.getElementById(rangeId).innerText =
        `${formatDateLabel(period.start)} to ${formatDateLabel(period.end)}`;
    document.getElementById(totalsId).innerHTML =
        `<span class="history-empty">Unable to load totals.</span>`;
    document.getElementById(costId).innerText = 'Unable to load estimate.';
}

function renderInvoiceComparisonError(elementId){
    const comparisonEl = document.getElementById(elementId);

    if(comparisonEl){
        comparisonEl.innerHTML = `<span class="history-empty">Unable to load comparison.</span>`;
    }
}

function renderSolarEntries(entries){
    const summaryEl = document.getElementById("solarSummary");
    const entriesEl = document.getElementById("solarEntries");

    if(!entries.length){
        summaryEl.innerText = 'No solar production values saved yet.';
        entriesEl.innerHTML = `<div class="history-empty">No solar production entries available.</div>`;
        return;
    }

    const measuredProduction = entries.reduce((sum, entry) => sum + (entry.producedDelta ?? 0), 0);
    const totalSavedKwh = entries.reduce((sum, entry) => sum + (entry.savedKwh ?? 0), 0);
    const totalSavings = entries.reduce((sum, entry) => sum + (entry.savedEuros ?? 0), 0);
    const latestReading = entries.reduce((latest, entry) => Math.max(latest, entry.K), 0);

    summaryEl.innerText =
        `Current total: ${latestReading.toFixed(2)} kWh | Produced between readings: ${measuredProduction.toFixed(2)} kWh | Self-consumed: ${totalSavedKwh.toFixed(2)} kWh | Estimated savings: ${formatCurrency(totalSavings)}`;

    const rows = entries.map(entry => `
        <tr>
            <td>${formatDateLabel(new Date(entry.d))}</td>
            <td>${entry.K.toFixed(2)}</td>
            <td>${entry.savedKwh === null ? '-' : entry.savedKwh.toFixed(2)}</td>
            <td>${entry.savedEuros === null ? '-' : formatCurrency(entry.savedEuros)}</td>
        </tr>
    `).join('');

    entriesEl.innerHTML = `
        <table class="solar-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Total kWh</th>
                    <th>Saved kWh</th>
                    <th>Saved EUR</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function setSolarStatus(message = ''){
    document.getElementById("solarStatus").innerText = message;
}

function upsertSolarEntry(entry){
    const existingIndex = solarEntries.findIndex(item => item.d === entry.d);

    if(existingIndex >= 0){
        solarEntries[existingIndex] = {
            ...solarEntries[existingIndex],
            ...entry
        };
        return;
    }

    solarEntries.push(entry);
    solarEntries.sort((a, b) => b.d - a.d);
}

async function renderSolarEntriesFromMemory(){
    const enrichedEntries = await enrichSolarEntries(solarEntries);
    renderSolarEntries(enrichedEntries);
}

async function fetchSolarProduction(){
    try{
        solarEntries = normalizeSolarEntries(ssrData.solarProduction ?? []);
        await renderSolarEntriesFromMemory();

    }catch(e){
        console.error(e);
        document.getElementById("solarSummary").innerText = 'Unable to load solar production values.';
        document.getElementById("solarEntries").innerHTML =
            `<div class="history-empty">Unable to load solar production entries.</div>`;
    }
}

function initSolarForm(){
    document.getElementById("solarDate").value = getDateInputValue(getDashboardToday());
    document.getElementById("solarForm").addEventListener('submit', submitSolarProduction);
}

async function sendSolarReading(reading){
    const response = await fetch(API_SOLAR_PRODUCTION, {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body: JSON.stringify({
            d: reading.d,
            k: reading.K
        })
    });

    if(!response.ok){
        throw new Error(`Failed to send solar production (${response.status})`);
    }
}

async function flushPendingSolarReadings(){
    if(flushPendingSolarPromise){
        return flushPendingSolarPromise;
    }

    if(!pendingSolarReadings.length){
        return;
    }

    flushPendingSolarPromise = (async () => {
        while(pendingSolarReadings.length){
            const reading = pendingSolarReadings[0];

            try{
                await sendSolarReading(reading);
                pendingSolarReadings.shift();
                setSolarStatus(`Solar reading for ${formatDateLabel(new Date(reading.d))} was sent successfully.`);
            }catch(e){
                console.error(e);
                setSolarStatus('Solar reading saved in memory. Waiting for network to send it.');
                break;
            }
        }
    })();

    try{
        await flushPendingSolarPromise;
    }finally{
        flushPendingSolarPromise = null;
    }
}

async function submitSolarProduction(event){
    event.preventDefault();

    const submitButton = document.getElementById("solarSubmit");
    const dateValue = document.getElementById("solarDate").value;
    const productionValue = Number(document.getElementById("solarValue").value);

    if(!dateValue || Number.isNaN(productionValue)){
        setSolarStatus('Please choose a date and enter a valid production value.');
        return;
    }

    const reading = {
        d: parseDateInputValue(dateValue),
        K: productionValue
    };

    submitButton.disabled = true;

    try{
        upsertSolarEntry(reading);
        pendingSolarReadings = pendingSolarReadings.filter(item => item.d !== reading.d);
        pendingSolarReadings.push(reading);
        await renderSolarEntriesFromMemory();

        document.getElementById("solarValue").value = '';
        setSolarStatus('Solar reading saved in memory. Trying to send it...');
        await flushPendingSolarReadings();
    }catch(e){
        console.error(e);
        setSolarStatus('Unable to queue solar production.');
    }finally{
        submitButton.disabled = false;
    }
}

function setupInvoiceToggle(){
    const currentCard = document.getElementById("currentInvoiceCard");
    const previousCard = document.getElementById("previousInvoiceCard");
    const toggleLabel = document.getElementById("invoiceToggleLabel");

    currentCard.addEventListener("click", () => {
        const isHidden = previousCard.classList.toggle("invoice-hidden");
        toggleLabel.innerText = isHidden ? 'Tap to show previous' : 'Tap to hide previous';
    });
}

async function fetchStats(dateString, elementId){
    const d = getStatsForDate(dateString);

    if(!d){
        return;
    }

    const importTotal = (d.maxTei - d.minTei).toFixed(2);
    const exportTotal = (d.maxTee - d.minTee).toFixed(2);

    document.getElementById(elementId).innerHTML =
    `<span class="import">Import: ${importTotal} kWh</span>
     <span class="export">Export: ${exportTotal} kWh</span>`;
}

async function fetchPeriodTotals(startDate, endDate){
    const dates = getDateRange(startDate, endDate);

    const results = dates.map(date => {
        const data = getStatsForDate(getDateString(date));

        if(!data){
            return null;
        }

        return {
            importTotal: data.maxTei - data.minTei,
            exportTotal: data.maxTee - data.minTee
        };
    });

    return results.filter(Boolean).reduce((totals, day) => ({
        importTotal: totals.importTotal + day.importTotal,
        exportTotal: totals.exportTotal + day.exportTotal
    }), { importTotal: 0, exportTotal: 0 });
}

function renderHistoryTotals(days){
    const container = document.getElementById("historyTotals");

    if(!days.length){
        container.innerHTML = `<div class="history-empty">No daily totals available.</div>`;
        return;
    }

    const rows = days.map(day => `
        <tr>
            <td>${day.label}</td>
            <td class="import">${day.importTotal.toFixed(2)}</td>
            <td class="export">${day.exportTotal.toFixed(2)}</td>
            <td>${formatCurrency(day.estimatedCost)}</td>
        </tr>
    `).join('');

    container.innerHTML = `
        <table class="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Import</th>
                    <th>Export</th>
                    <th>Estimated Cost</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function fetchHistoryTotals(){
    const dates = getPreviousAndCurrentDates(31);

    const results = dates.map(date => {
        const data = getStatsForDate(getDateString(date));

        if(!data){
            return null;
        }

        return {
            label: date.toLocaleDateString(['pt-PT'], {
                year:'numeric',
                month:'2-digit',
                day:'2-digit'
            }),
            importTotal: data.maxTei - data.minTei,
            exportTotal: data.maxTee - data.minTee,
            estimatedCost: calculateEstimatedDailyCost(data.maxTei - data.minTei)
        };
    });

    renderHistoryTotals(results.filter(Boolean));
}

async function fetchInvoiceSummaries(){
    const today = getDashboardToday();
    const currentPeriod = getCurrentInvoicePeriod(today);
    const previousPeriod = {
        start: addMonths(currentPeriod.start, -1),
        end: addMonths(currentPeriod.end, -1)
    };
    const currentPeriodEnd = today < currentPeriod.end ? today : currentPeriod.end;
    const currentPeriodDays = getDateRange(currentPeriod.start, currentPeriodEnd).length;
    const previousPeriodDays = getDateRange(previousPeriod.start, previousPeriod.end).length;
    const comparisonDays = Math.min(currentPeriodDays, previousPeriodDays);
    const currentComparablePeriod = {
        start: new Date(currentPeriod.start),
        end: addDays(currentPeriod.start, comparisonDays - 1)
    };
    const previousComparablePeriod = {
        start: new Date(previousPeriod.start),
        end: addDays(previousPeriod.start, comparisonDays - 1)
    };

    try{
        const [currentTotals, previousTotals, currentComparableTotals, previousComparableTotals] = await Promise.all([
            fetchPeriodTotals(currentPeriod.start, currentPeriodEnd),
            fetchPeriodTotals(previousPeriod.start, previousPeriod.end),
            fetchPeriodTotals(currentComparablePeriod.start, currentComparablePeriod.end),
            fetchPeriodTotals(previousComparablePeriod.start, previousComparablePeriod.end)
        ]);

        const currentEstimatedCost = calculateEstimatedCost(currentTotals.importTotal, currentPeriodDays);
        const currentComparableEstimatedCost = calculateEstimatedCost(
            currentComparableTotals.importTotal,
            comparisonDays
        );
        const previousComparableEstimatedCost = calculateEstimatedCost(
            previousComparableTotals.importTotal,
            comparisonDays
        );

        renderInvoiceTotals(
            "currentInvoiceRange",
            "currentInvoiceTotals",
            "currentInvoiceCost",
            currentPeriod,
            currentTotals,
            currentPeriodEnd < currentPeriod.end,
            currentPeriodDays
        );

        if(comparisonDays < currentPeriodDays){
            renderInvoiceComparison("currentInvoiceComparison", {
                label: `For the first ${comparisonDays} days, vs ${formatDateLabel(previousComparablePeriod.start)} to ${formatDateLabel(previousComparablePeriod.end)}:`,
                period: previousComparablePeriod,
                elapsedDays: comparisonDays,
                importDelta: currentComparableTotals.importTotal - previousComparableTotals.importTotal,
                costDelta: currentComparableEstimatedCost - previousComparableEstimatedCost
            });
        }else{
            renderInvoiceComparison("currentInvoiceComparison", {
                period: previousComparablePeriod,
                elapsedDays: comparisonDays,
                importDelta: currentTotals.importTotal - previousComparableTotals.importTotal,
                costDelta: currentEstimatedCost - previousComparableEstimatedCost
            });
        }

        renderInvoiceTotals(
            "previousInvoiceRange",
            "previousInvoiceTotals",
            "previousInvoiceCost",
            previousPeriod,
            previousTotals,
            false,
            previousPeriodDays
        );

    }catch(e){
        console.error(e);
        renderInvoiceError("currentInvoiceRange", "currentInvoiceTotals", "currentInvoiceCost", currentPeriod);
        renderInvoiceComparisonError("currentInvoiceComparison");
        renderInvoiceError("previousInvoiceRange", "previousInvoiceTotals", "previousInvoiceCost", previousPeriod);
    }
}

function updateChart(chart,data){
    const sampledData = aggregateByMinuteMax(data);

    chart.$timestamps = sampledData.map(x=>x.t);
    chart.data.labels = sampledData.map(x=>unixToTime(x.t));
    chart.data.datasets[0].data = sampledData.map(x=>x.i);
    chart.data.datasets[1].data = sampledData.map(x=>x.e);
    chart.update();
}

async function fetchToday(){
    const data = Array.isArray(ssrData.today) ? ssrData.today : [];

    updateChart(chartToday, data);

    const now = ssrData.current?.t ?? (data.length ? data[data.length - 1].t : 0);
    const fourHoursAgo = now - (4 * 3600);
    const last4 = data.filter(x => x.t >= fourHoursAgo);

    updateChart(chart6h, last4);
}

async function fetchYesterday(){
    const data = Array.isArray(ssrData.yesterday) ? ssrData.yesterday : [];
    updateChart(chartYesterday, data);
}

function initCharts(){
    chart6h = createChart(document.getElementById('chart6h'), 15 * 60);
    chartToday = createChart(document.getElementById('chartToday'), 60 * 60);
    chartYesterday = createChart(document.getElementById('chartYesterday'), 60 * 60);
}


async function init(){

    initCharts();
    setupInvoiceToggle();
    initSolarForm();
    window.addEventListener('online', flushPendingSolarReadings);
    setInterval(flushPendingSolarReadings, 15000);

	const today = getDashboardToday();
    const yesterday = getYesterday(today);

    const todayStr = getDateString(today);
    const yesterdayStr = getDateString(yesterday);

    await fetchSolarProduction();
    await fetchInvoiceSummaries();
    await fetchCurrent();
    await fetchToday();
    await fetchYesterday();
    await fetchHistoryTotals();

	await fetchStats(todayStr,"statsToday");
    await fetchStats(todayStr,"statsToday6h");
    await fetchStats(yesterdayStr,"statsYesterday");
    await flushPendingSolarReadings();
}

init();
